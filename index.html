<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0e0e0e" />
  <title>KevTify</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <!-- Force dark bg before React mounts — prevents white flash -->

  <style>
    html, body { background: #0e0e0e !important; color: #e8e8e8 !important; }
    #root { min-height: 100vh; background: #0e0e0e; }
    #pre-load {
      position: fixed; inset: 0; background: #0e0e0e;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      z-index: 9999;
    }
    #pre-load .pl-logo {
      font-family: Arial Black, sans-serif; font-size: 38px;
      font-weight: 900; color: #38bdf8; letter-spacing: 0.06em;
    }
    #pre-load .pl-tagline {
      font-family: monospace; font-size: 11px; color: #5e5e5e;
      letter-spacing: 0.18em; text-transform: uppercase;
    }
    #pre-load .pl-bar  { width: 140px; height: 2px; background: #1e1e1e; border-radius: 1px; overflow: hidden; }
    #pre-load .pl-fill { height: 100%; background: #38bdf8; animation: pl 1.2s ease-in-out infinite; }
    @keyframes pl { 0%{width:0%;margin-left:0%} 50%{width:60%;margin-left:20%} 100%{width:0%;margin-left:100%} }
  </style>

  <style>
    :root {
      --bg:#0e0e0e; --s1:#161616; --s2:#1e1e1e; --s3:#272727; --s4:#333; --s5:#444;
      --go:#22c55e; --go-bg:#052010; --go-b:#166534;
      --mb:#f59e0b; --mb-bg:#1c1204; --mb-b:#92400e;
      --ng:#ef4444; --ng-bg:#1c0404; --ng-b:#991b1b;
      --acc:#38bdf8; --acc-bg:#0c1f2e;
      --txt:#e8e8e8; --txt2:#a0a0a0; --txt3:#5e5e5e;
      --mono:"DM Mono",monospace; --head:"Rajdhani",sans-serif; --sans:"DM Sans",sans-serif;
      --r:12px; --rsm:8px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{font-size:16px;-webkit-text-size-adjust:100%;background:var(--bg);}
    body{background:var(--bg);color:var(--txt);font-family:var(--sans);min-height:100vh;min-height:-webkit-fill-available;-webkit-font-smoothing:antialiased;overflow-x:hidden;}

    .topbar{position:sticky;top:0;z-index:100;background:var(--s1);border-bottom:1px solid var(--s3);display:flex;align-items:center;padding:0 16px;gap:12px;height:calc(56px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);}
    .t-avatar{width:34px;height:34px;border-radius:50%;overflow:hidden;border:2px solid var(--acc);flex-shrink:0;}
    .t-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
    .t-name{font-family:var(--head);font-size:22px;font-weight:700;letter-spacing:.03em;flex:1;}
    .t-status{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--txt3);letter-spacing:.06em;}
    .status-dot{width:7px;height:7px;border-radius:50%;background:var(--go);box-shadow:0 0 6px var(--go);animation:blink 2.5s ease-in-out infinite;}
    @keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

    .main{padding:16px 16px 100px;max-width:540px;margin:0 auto;scroll-padding-bottom:120px;}

    .card{background:var(--s1);border:1px solid var(--s3);border-radius:var(--r);overflow:hidden;margin-bottom:10px;}
    .card-hdr{padding:11px 16px;border-bottom:1px solid var(--s3);background:var(--s2);display:flex;align-items:center;justify-content:space-between;}
    .hdr-left{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--txt3);text-transform:uppercase;}
    .hdr-dot{width:5px;height:5px;border-radius:50%;background:var(--acc);flex-shrink:0;}
    .hdr-right{font-family:var(--mono);font-size:10px;color:var(--txt3);letter-spacing:.05em;}

    /* INSTALL BANNER */
    .install-banner{display:flex;align-items:center;gap:12px;background:var(--acc-bg);border:1px solid #1a4060;border-radius:var(--r);padding:12px 16px;margin-bottom:10px;}
    .install-text{flex:1;font-size:13px;color:var(--txt2);line-height:1.5;}
    .install-text strong{color:var(--acc);font-weight:600;}
    .install-dismiss{font-family:var(--mono);font-size:18px;color:var(--txt3);cursor:pointer;padding:4px;-webkit-tap-highlight-color:transparent;flex-shrink:0;}

    /* MODE TOGGLE */
    .mode-toggle{display:flex;background:var(--s2);border:1px solid var(--s3);border-radius:10px;padding:4px;margin-bottom:12px;gap:4px;}
    .mode-btn{flex:1;padding:10px 8px;border:none;border-radius:7px;font-family:var(--head);font-size:15px;font-weight:700;letter-spacing:.04em;cursor:pointer;transition:all .18s;background:transparent;color:var(--txt3);-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;gap:6px;}
    .mode-btn.active-flip{background:var(--acc);color:#000;box-shadow:0 2px 10px #38bdf830;}
    .mode-btn.active-buy{background:var(--go);color:#000;box-shadow:0 2px 10px #22c55e30;}
    .mode-btn:not(.active-flip):not(.active-buy):active{background:var(--s3);color:var(--txt2);}

    /* CONTEXT */
    .context-wrap{margin-bottom:10px;position:relative;}
    .context-input{width:100%;background:var(--s1);border:1px solid var(--s3);border-radius:var(--r);padding:12px 16px;padding-bottom:28px;color:var(--txt);font-family:var(--sans);font-size:16px;outline:none;resize:none;line-height:1.5;-webkit-appearance:none;}
    .context-input::placeholder{color:var(--txt3);}
    .context-input:focus{border-color:var(--s5);}
    .context-count{position:absolute;bottom:8px;right:12px;font-family:var(--mono);font-size:9px;color:var(--txt3);letter-spacing:.06em;pointer-events:none;}
    .context-count.warn{color:var(--mb);}

    /* UPLOAD */
    .upload-tap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:40px 20px;min-height:200px;cursor:pointer;position:relative;background:var(--bg);-webkit-tap-highlight-color:transparent;transition:background .15s;}
    .upload-tap:active{background:var(--acc-bg);}
    .upload-tap input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
    .up-icon{width:60px;height:60px;background:var(--s2);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;}
    .up-label{font-size:17px;font-weight:600;color:var(--txt);}
    .up-sub{font-family:var(--mono);font-size:11px;color:var(--txt3);letter-spacing:.06em;}
    .fmt-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
    .fmt-chip{font-family:var(--mono);font-size:9px;color:var(--txt3);border:1px solid var(--s4);padding:3px 8px;border-radius:4px;letter-spacing:.06em;background:var(--s2);}

    /* PROCESSING OVERLAY on upload */
    .processing-overlay{position:relative;background:#000;}
    .processing-overlay-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7);font-family:var(--mono);font-size:11px;color:var(--acc);letter-spacing:.12em;}

    /* PREVIEW */
    .preview-wrap{position:relative;background:#000;}
    .preview-img{width:100%;max-height:280px;object-fit:contain;display:block;}
    .preview-pill{position:absolute;bottom:10px;left:10px;background:rgba(14,14,14,.9);border:1px solid var(--s4);border-radius:20px;font-family:var(--mono);font-size:9px;color:var(--go);padding:4px 12px;letter-spacing:.1em;display:flex;align-items:center;gap:6px;}
    .preview-pill::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--go);}
    .remove-x{position:absolute;top:10px;right:10px;width:34px;height:34px;background:rgba(14,14,14,.9);border:1px solid var(--s4);border-radius:8px;color:var(--txt3);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}

    /* RESULT THUMB */
    .result-thumb{width:100%;border-radius:var(--r);overflow:hidden;border:1px solid var(--s3);margin-bottom:10px;background:var(--s1);display:flex;align-items:center;padding:10px 14px;gap:12px;}
    .result-thumb img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0;}
    .result-thumb-info{flex:1;min-width:0;}
    .result-thumb-item{font-family:var(--head);font-size:16px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .result-thumb-mode{font-family:var(--mono);font-size:9px;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase;margin-top:3px;}
    .rescan-btn{font-family:var(--mono);font-size:10px;color:var(--txt3);letter-spacing:.08em;background:var(--s3);border:1px solid var(--s4);border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;text-transform:uppercase;}

    /* ANALYZE BTN */
    .analyze-btn{width:100%;min-height:58px;color:#000;font-family:var(--head);font-weight:700;font-size:21px;letter-spacing:.06em;text-transform:uppercase;border:none;border-radius:var(--r);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;-webkit-tap-highlight-color:transparent;transition:opacity .15s,transform .1s;}
    .analyze-btn.flip-btn{background:var(--acc);}
    .analyze-btn.buy-btn{background:var(--go);}
    .analyze-btn:active:not(:disabled){opacity:.82;transform:scale(.99);}
    .analyze-btn:disabled{background:var(--s3)!important;color:var(--txt3);}

    /* LOADING */
    .loading-card{background:var(--s1);border:1px solid var(--s3);border-radius:var(--r);padding:18px 20px;margin-bottom:10px;}
    .loading-track{height:3px;background:var(--s3);border-radius:2px;overflow:hidden;margin-bottom:10px;}
    .loading-fill{height:100%;background:linear-gradient(90deg,var(--acc-bg),var(--acc));border-radius:2px;animation:sweep 1.4s ease-in-out infinite;}
    @keyframes sweep{0%{width:0%;margin-left:0%;}50%{width:55%;margin-left:22%;}100%{width:0%;margin-left:100%;}}
    .loading-lbl{font-family:var(--mono);font-size:11px;color:var(--acc);letter-spacing:.1em;text-transform:uppercase;}
    .loading-ctx{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-top:5px;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    /* RESULTS */
    .results{display:flex;flex-direction:column;gap:10px;animation:rise .3s ease;}
    @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

    /* VERDICT */
    .verdict-card{background:var(--s1);border:1px solid var(--s3);border-radius:var(--r);overflow:hidden;}
    .verdict-card.v-go{border-color:var(--go-b);}
    .verdict-card.v-maybe{border-color:var(--mb-b);}
    .verdict-card.v-nogo{border-color:var(--ng-b);}
    .verdict-top{display:flex;align-items:center;padding:16px;gap:12px;border-bottom:1px solid var(--s3);}
    .score-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:68px;}
    .score-big{font-family:var(--head);font-size:56px;font-weight:700;line-height:1;letter-spacing:-.02em;}
    .v-go .score-big{color:var(--go);} .v-maybe .score-big{color:var(--mb);} .v-nogo .score-big{color:var(--ng);}
    .score-denom{font-family:var(--mono);font-size:9px;color:var(--txt3);letter-spacing:.1em;}
    .badge-col{flex:1;min-width:0;}
    .badge-word{font-family:var(--head);font-size:28px;font-weight:700;letter-spacing:.05em;line-height:1;}
    .v-go .badge-word{color:var(--go);} .v-maybe .badge-word{color:var(--mb);} .v-nogo .badge-word{color:var(--ng);}
    .badge-sub{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-top:4px;}
    .v-go .badge-sub{color:var(--go-b);} .v-maybe .badge-sub{color:var(--mb-b);} .v-nogo .badge-sub{color:var(--ng-b);}
    .offer-col{flex-shrink:0;text-align:right;}
    .offer-lbl{font-family:var(--mono);font-size:9px;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
    .offer-val{font-family:var(--head);font-size:24px;font-weight:700;color:var(--go);line-height:1;}
    .offer-ask{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-top:4px;}
    .summary-row{padding:12px 16px;background:var(--s2);}
    .summary-txt{font-size:14px;color:var(--txt2);line-height:1.6;font-weight:300;}

    /* MATH */
    .math-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--s3);border:1px solid var(--s3);border-radius:var(--r);overflow:hidden;}
    .math-cell{background:var(--s1);padding:14px 16px;}
    .math-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--txt3);text-transform:uppercase;margin-bottom:6px;}
    .math-val{font-family:var(--head);font-size:22px;font-weight:700;line-height:1;color:var(--txt);}
    .math-val.pos{color:var(--go);} .math-val.neg{color:var(--ng);} .math-val.warn{color:var(--mb);}
    .math-range{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-top:4px;}
    .math-note{grid-column:1/-1;background:var(--s2);padding:10px 16px;font-family:var(--mono);font-size:10px;color:var(--txt3);border-top:1px solid var(--s3);}

    /* FLAGS */
    .flag-row{display:flex;border-bottom:1px solid var(--s3);}
    .flag-row:last-child{border-bottom:none;}
    .flag-sev{width:68px;flex-shrink:0;padding:14px 10px 12px 12px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:flex-start;gap:5px;border-right:1px solid var(--s3);font-weight:500;}
    .sev-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:1px;}
    .flag-row.red .flag-sev{color:var(--ng);} .flag-row.red .sev-dot{background:var(--ng);}
    .flag-row.yellow .flag-sev{color:var(--mb);} .flag-row.yellow .sev-dot{background:var(--mb);}
    .flag-row.green .flag-sev{color:var(--go);} .flag-row.green .sev-dot{background:var(--go);}
    .flag-txt{flex:1;padding:12px 14px;font-size:13px;color:var(--txt2);line-height:1.55;font-weight:300;}

    /* NEGOTIATION */
    .neg-row{display:flex;border-bottom:1px solid var(--s3);}
    .neg-row:last-child{border-bottom:none;}
    .neg-n{width:46px;flex-shrink:0;font-family:var(--mono);font-size:12px;color:var(--acc);display:flex;align-items:center;justify-content:center;border-right:1px solid var(--s3);}
    .neg-t{flex:1;padding:14px;font-size:14px;color:var(--txt2);line-height:1.6;font-weight:300;}
    .copy-row{padding:12px 16px;background:var(--s2);border-top:1px solid var(--s3);display:flex;justify-content:space-between;align-items:center;gap:8px;}
    .copy-btn{min-height:46px;padding:0 16px;background:var(--s3);border:1px solid var(--s5);color:var(--txt2);font-family:var(--mono);font-size:11px;letter-spacing:.1em;border-radius:var(--rsm);cursor:pointer;text-transform:uppercase;-webkit-tap-highlight-color:transparent;}
    .copy-btn.done{color:var(--go);border-color:var(--go-b);}
    .share-btn{min-height:46px;padding:0 16px;background:var(--acc);border:none;color:#000;font-family:var(--mono);font-size:11px;letter-spacing:.1em;border-radius:var(--rsm);cursor:pointer;text-transform:uppercase;-webkit-tap-highlight-color:transparent;font-weight:500;}

    /* RESET */
    .reset-btn{width:100%;min-height:52px;background:transparent;border:1px solid var(--s4);color:var(--txt3);font-family:var(--mono);font-size:12px;letter-spacing:.12em;border-radius:var(--r);cursor:pointer;text-transform:uppercase;-webkit-tap-highlight-color:transparent;}

    /* ERROR */
    .err-card{background:var(--ng-bg);border:1px solid var(--ng-b);border-radius:var(--r);padding:16px;margin-bottom:10px;}
    .err-msg{font-family:var(--mono);font-size:12px;color:var(--ng);letter-spacing:.05em;line-height:1.6;margin-bottom:10px;}
    .retry-btn{min-height:44px;padding:0 20px;background:var(--ng);border:none;color:#000;font-family:var(--head);font-size:16px;font-weight:700;letter-spacing:.06em;border-radius:var(--rsm);cursor:pointer;-webkit-tap-highlight-color:transparent;}

    /* HISTORY */
    .hist-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--s3);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s;}
    .hist-item:last-child{border-bottom:none;}
    .hist-item:active{background:var(--s2);}
    .hist-thumb{width:48px;height:48px;object-fit:cover;border-radius:8px;flex-shrink:0;background:var(--s3);}
    .hist-info{flex:1;min-width:0;}
    .hist-item-name{font-size:14px;font-weight:500;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .hist-meta{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-top:3px;letter-spacing:.04em;}
    .hist-note{font-size:12px;color:var(--txt2);margin-top:4px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .hist-badge{font-family:var(--head);font-size:16px;font-weight:700;flex-shrink:0;}
    .hist-badge.go{color:var(--go);} .hist-badge.maybe{color:var(--mb);} .hist-badge.nogo{color:var(--ng);}
    .hist-score{font-family:var(--mono);font-size:10px;color:var(--txt3);text-align:right;margin-top:2px;}
    .hist-empty{padding:48px 20px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--txt3);letter-spacing:.08em;line-height:2;}
    .hist-clear{width:100%;padding:14px;background:transparent;border:none;border-top:1px solid var(--s3);font-family:var(--mono);font-size:10px;color:var(--txt3);letter-spacing:.1em;cursor:pointer;text-transform:uppercase;-webkit-tap-highlight-color:transparent;}
    .hist-clear:active{color:var(--ng);}
    .hist-warn{padding:10px 16px;font-family:var(--mono);font-size:10px;color:var(--txt3);background:var(--s2);border-top:1px solid var(--s3);letter-spacing:.04em;line-height:1.6;}

    /* NOTE MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end;}
    .modal-sheet{width:100%;background:var(--s1);border-top:1px solid var(--s3);border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));}
    .modal-title{font-family:var(--head);font-size:20px;font-weight:700;color:var(--txt);margin-bottom:12px;}
    .modal-input{width:100%;background:var(--s2);border:1px solid var(--s3);border-radius:var(--rsm);padding:12px 14px;color:var(--txt);font-family:var(--sans);font-size:16px;outline:none;resize:none;-webkit-appearance:none;line-height:1.5;}
    .modal-input:focus{border-color:var(--s5);}
    .modal-input::placeholder{color:var(--txt3);}
    .modal-row{display:flex;gap:8px;margin-top:10px;}
    .modal-save{flex:1;min-height:48px;background:var(--acc);border:none;color:#000;font-family:var(--head);font-size:17px;font-weight:700;border-radius:var(--rsm);cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .modal-cancel{min-height:48px;padding:0 20px;background:var(--s3);border:1px solid var(--s4);color:var(--txt2);font-family:var(--mono);font-size:11px;letter-spacing:.1em;border-radius:var(--rsm);cursor:pointer;text-transform:uppercase;-webkit-tap-highlight-color:transparent;}

    /* SETTINGS */
    .settings-section{margin-bottom:20px;}
    .settings-label{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--txt3);text-transform:uppercase;padding:0 4px;margin-bottom:6px;}
    .api-input{width:100%;background:var(--s1);border:1px solid var(--s3);border-radius:var(--r);padding:14px 16px;color:var(--txt);font-family:var(--mono);font-size:13px;outline:none;letter-spacing:.04em;-webkit-appearance:none;}
    .api-input:focus{border-color:var(--acc);}
    .api-input::placeholder{color:var(--txt3);}
    .save-btn{width:100%;min-height:52px;background:var(--acc);color:#000;font-family:var(--head);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;border:none;border-radius:var(--r);cursor:pointer;margin-top:8px;-webkit-tap-highlight-color:transparent;transition:opacity .15s;}
    .save-btn:active{opacity:.82;}
    .save-btn.saved{background:var(--go);}
    .settings-hint{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-top:8px;line-height:1.7;letter-spacing:.03em;padding:0 2px;}
    .settings-hint a{color:var(--acc);text-decoration:none;}
    .settings-row{display:flex;align-items:center;justify-content:space-between;background:var(--s1);border:1px solid var(--s3);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;}
    .settings-row-label{font-size:14px;font-weight:500;color:var(--txt);}
    .settings-row-sub{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-top:3px;letter-spacing:.03em;}
    .key-status{font-family:var(--mono);font-size:10px;padding:4px 10px;border-radius:4px;letter-spacing:.06em;}
    .key-status.set{color:var(--go);background:var(--go-bg);border:1px solid var(--go-b);}
    .key-status.unset{color:var(--ng);background:var(--ng-bg);border:1px solid var(--ng-b);}

    /* NO KEY BANNER */
    .nokey-banner{background:var(--ng-bg);border:1px solid var(--ng-b);border-radius:var(--r);padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
    .nokey-text{flex:1;font-family:var(--mono);font-size:11px;color:var(--ng);line-height:1.6;letter-spacing:.03em;}
    .nokey-btn{font-family:var(--head);font-size:15px;font-weight:700;background:var(--ng);color:#000;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;flex-shrink:0;white-space:nowrap;-webkit-tap-highlight-color:transparent;}



    /* ── DATA VIZ ── */

    /* Animated score - subtle tick effect */
    .score-big.animating { transition: none; }

    /* PRICE GAUGE */
    .price-gauge {
      background: var(--s1); border: 1px solid var(--s3); border-radius: var(--r);
      padding: 18px 18px 22px; overflow: hidden;
    }
    .gauge-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .gauge-title { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: var(--txt3); text-transform: uppercase; }
    .gauge-verdict { font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: 0.08em; padding: 3px 9px; border-radius: 4px; text-transform: uppercase; }
    .gauge-verdict.under { color: var(--go); background: var(--go-bg); border: 1px solid var(--go-b); }
    .gauge-verdict.over  { color: var(--ng); background: var(--ng-bg); border: 1px solid var(--ng-b); }
    .gauge-verdict.fair  { color: var(--mb); background: var(--mb-bg); border: 1px solid var(--mb-b); }

    .gauge-track {
      position: relative; height: 8px;
      background: linear-gradient(90deg, var(--go) 0%, var(--mb) 50%, var(--ng) 100%);
      border-radius: 4px; margin: 24px 0 14px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.4);
    }
    .gauge-segment {
      position: absolute; top: -3px; bottom: -3px;
      border-left: 2px dashed rgba(255,255,255,0.25);
    }
    .gauge-pointer {
      position: absolute; top: -8px; transform: translateX(-50%);
      width: 4px; height: 24px; background: var(--txt);
      border-radius: 2px; box-shadow: 0 0 10px rgba(255,255,255,0.6);
      transition: left 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .gauge-pointer::after {
      content: ""; position: absolute; top: -7px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-top: 8px solid var(--txt);
    }
    .gauge-labels { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 9px; color: var(--txt3); letter-spacing: 0.06em; }
    .gauge-label-mid { font-family: var(--mono); font-size: 11px; color: var(--txt); font-weight: 500; }
    .gauge-asking-label { font-family: var(--mono); font-size: 10px; color: var(--txt2); margin-top: 4px; text-align: center; }
    .gauge-asking-label strong { color: var(--txt); font-weight: 600; }

    /* WATERFALL */
    .waterfall { background: var(--s1); border: 1px solid var(--s3); border-radius: var(--r); padding: 18px; }
    .waterfall-title { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: var(--txt3); text-transform: uppercase; margin-bottom: 14px; }
    .wf-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .wf-row:last-child { margin-bottom: 0; }
    .wf-label { width: 78px; flex-shrink: 0; font-family: var(--mono); font-size: 10px; color: var(--txt2); letter-spacing: 0.04em; }
    .wf-bar-wrap { flex: 1; height: 22px; background: var(--s2); border-radius: 4px; overflow: hidden; position: relative; }
    .wf-bar {
      height: 100%; border-radius: 4px;
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; align-items: center; padding-right: 8px; justify-content: flex-end;
      font-family: var(--mono); font-size: 11px; font-weight: 500;
    }
    .wf-bar.cost   { background: linear-gradient(90deg, #6b1818, var(--ng)); color: #fff; }
    .wf-bar.repair { background: linear-gradient(90deg, #92400e, var(--mb)); color: #fff; }
    .wf-bar.value  { background: linear-gradient(90deg, #166534, var(--go)); color: #000; }
    .wf-bar.profit { background: linear-gradient(90deg, var(--go-b), var(--go)); color: #000; }
    .wf-bar.loss   { background: linear-gradient(90deg, var(--ng-b), var(--ng)); color: #fff; }
    .wf-divider { height: 1px; background: var(--s3); margin: 12px 0; }
    .wf-final { display: flex; justify-content: space-between; align-items: center; padding-top: 4px; }
    .wf-final-lbl { font-family: var(--mono); font-size: 11px; color: var(--txt2); letter-spacing: 0.06em; text-transform: uppercase; }
    .wf-final-val { font-family: var(--head); font-size: 22px; font-weight: 700; }
    .wf-final-val.pos { color: var(--go); }
    .wf-final-val.neg { color: var(--ng); }

    /* CASCADING FLAGS */
    @keyframes flagIn {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .flag-row { animation: flagIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) backwards; }
    .flag-row:nth-child(1) { animation-delay: 0.05s; }
    .flag-row:nth-child(2) { animation-delay: 0.13s; }
    .flag-row:nth-child(3) { animation-delay: 0.21s; }
    .flag-row:nth-child(4) { animation-delay: 0.29s; }
    .flag-row:nth-child(5) { animation-delay: 0.37s; }
    .flag-row:nth-child(6) { animation-delay: 0.45s; }

    /* NEGOTIATION CASCADE */
    @keyframes negIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .neg-row { animation: negIn 0.35s cubic-bezier(0.4, 0, 0.2, 1) backwards; }
    .neg-row:nth-child(1) { animation-delay: 0.4s; }
    .neg-row:nth-child(2) { animation-delay: 0.5s; }
    .neg-row:nth-child(3) { animation-delay: 0.6s; }
    .neg-row:nth-child(4) { animation-delay: 0.7s; }

    /* VERDICT REVEAL */
    @keyframes verdictReveal {
      0%   { opacity: 0; transform: scale(0.85); }
      60%  { transform: scale(1.04); }
      100% { opacity: 1; transform: scale(1); }
    }
    .badge-word { animation: verdictReveal 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); transform-origin: left center; }

    /* MATH CELLS STAGGER */
    @keyframes mathIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .math-cell { animation: mathIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) backwards; }
    .math-cell:nth-child(1) { animation-delay: 0.15s; }
    .math-cell:nth-child(2) { animation-delay: 0.22s; }
    .math-cell:nth-child(3) { animation-delay: 0.29s; }
    .math-cell:nth-child(4) { animation-delay: 0.36s; }

    /* LOADING PHASES */
    .phase-list { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
    .phase-item {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 10px; border-radius: 6px;
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
      transition: all 0.3s ease;
    }
    .phase-item.pending { color: var(--txt3); }
    .phase-item.active  { color: var(--acc); background: var(--acc-bg); }
    .phase-item.done    { color: var(--go); }
    .phase-icon {
      width: 16px; height: 16px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; flex-shrink: 0;
      border: 1.5px solid currentColor;
    }
    .phase-item.active .phase-icon::after {
      content: ""; width: 5px; height: 5px; border-radius: 50%;
      background: var(--acc); animation: pulse 1s ease-in-out infinite;
    }
    .phase-item.done .phase-icon { background: var(--go); border-color: var(--go); color: #000; font-weight: 700; }
    .phase-item.done .phase-icon::after { content: "✓"; font-size: 11px; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

    /* RESULTS CARD ENTRY STAGGER */
    .verdict-card { animation: rise 0.45s cubic-bezier(0.4, 0, 0.2, 1); }
    .price-gauge  { animation: rise 0.45s cubic-bezier(0.4, 0, 0.2, 1) 0.05s backwards; }
    .waterfall    { animation: rise 0.45s cubic-bezier(0.4, 0, 0.2, 1) 0.1s backwards; }
    .results > .card { animation: rise 0.45s cubic-bezier(0.4, 0, 0.2, 1) 0.15s backwards; }
    .result-thumb { animation: rise 0.35s cubic-bezier(0.4, 0, 0.2, 1); }



    /* ── HONEST PHASE LOADER ── */
    .phase-list { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
    /* Override prior styles - phases now driven by real state */

    /* ── COLLAPSIBLE RAW NUMBERS ── */
    .raw-toggle {
      width: 100%; background: var(--s1); border: 1px solid var(--s3);
      border-radius: var(--r); padding: 11px 16px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
      color: var(--txt3); text-transform: uppercase; transition: all 0.15s;
    }
    .raw-toggle:active { background: var(--s2); }
    .raw-toggle.open { border-radius: var(--r) var(--r) 0 0; border-bottom: none; }
    .raw-arrow { transition: transform 0.25s ease; font-size: 12px; }
    .raw-arrow.open { transform: rotate(180deg); }
    .raw-content { background: var(--s1); border: 1px solid var(--s3); border-top: none; border-radius: 0 0 var(--r) var(--r); overflow: hidden; }
    .raw-content .math-grid { border-radius: 0; border: none; }
    .raw-content .math-grid .math-cell { animation: none !important; }

    /* ── SCORE PERCENTILE ── */
    .score-percentile {
      display: inline-flex; align-items: center; gap: 5px;
      font-family: var(--mono); font-size: 9px;
      color: var(--txt3); letter-spacing: 0.08em;
      margin-top: 5px; text-transform: uppercase;
    }
    .percentile-pill {
      padding: 2px 7px; border-radius: 10px;
      font-weight: 500;
    }
    .percentile-pill.top { color: var(--go); background: var(--go-bg); border: 1px solid var(--go-b); }
    .percentile-pill.mid { color: var(--mb); background: var(--mb-bg); border: 1px solid var(--mb-b); }
    .percentile-pill.low { color: var(--ng); background: var(--ng-bg); border: 1px solid var(--ng-b); }

    /* ── TAPPABLE NEG LINES ── */
    .neg-row { cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.2s; }
    .neg-row:active { background: var(--s2); }
    .neg-row.copied { background: var(--go-bg); animation: copyFlash 0.6s ease; }
    @keyframes copyFlash {
      0%   { background: var(--go-bg); }
      50%  { background: #0a3018; }
      100% { background: var(--go-bg); }
    }
    .neg-row.copied .neg-n { color: var(--go); }
    .neg-row .copy-hint {
      font-family: var(--mono); font-size: 9px; color: var(--txt3);
      letter-spacing: 0.1em; padding-right: 14px;
      align-self: center; opacity: 0; transition: opacity 0.2s;
      flex-shrink: 0;
    }
    .neg-row:hover .copy-hint, .neg-row.copied .copy-hint { opacity: 1; }
    .neg-row.copied .copy-hint { color: var(--go); }

    /* ── SWIPE TO DELETE HISTORY ── */
    .hist-item-wrap {
      position: relative; overflow: hidden;
      border-bottom: 1px solid var(--s3);
    }
    .hist-item-wrap:last-child { border-bottom: none; }
    .hist-delete-bg {
      position: absolute; right: 0; top: 0; bottom: 0;
      width: 90px; background: var(--ng);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--head); font-size: 14px; font-weight: 700;
      color: #fff; letter-spacing: 0.05em;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      text-transform: uppercase;
    }
    .hist-item-swipe {
      position: relative; background: var(--s1);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform; z-index: 2;
      touch-action: pan-y;
    }
    .hist-item-swipe.swiped { transform: translateX(-90px); }
    .hist-item-wrap .hist-item { border-bottom: none; }

    /* ── HISTORY FILTERS ── */
    .hist-controls {
      padding: 10px 12px; background: var(--s2);
      border-bottom: 1px solid var(--s3);
      display: flex; gap: 6px; align-items: center;
      flex-wrap: wrap;
    }
    .hist-search {
      flex: 1; min-width: 120px;
      background: var(--s1); border: 1px solid var(--s3);
      border-radius: 6px; padding: 7px 10px;
      color: var(--txt); font-family: var(--sans); font-size: 13px;
      outline: none; -webkit-appearance: none;
    }
    .hist-search:focus { border-color: var(--s5); }
    .hist-search::placeholder { color: var(--txt3); }
    .hist-filter-pill {
      font-family: var(--mono); font-size: 9px;
      letter-spacing: 0.06em; padding: 6px 10px;
      border-radius: 5px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      background: var(--s1); border: 1px solid var(--s3);
      color: var(--txt3); text-transform: uppercase;
      transition: all 0.15s;
    }
    .hist-filter-pill.active { background: var(--acc); color: #000; border-color: var(--acc); font-weight: 500; }

    /* ── RESUME LAST SCAN BANNER ── */
    .resume-banner {
      background: var(--s1); border: 1px solid var(--s3);
      border-radius: var(--r); padding: 10px 12px;
      margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: all 0.15s;
    }
    .resume-banner:active { background: var(--s2); }
    .resume-thumb {
      width: 40px; height: 40px; border-radius: 6px;
      object-fit: cover; flex-shrink: 0; background: var(--s3);
    }
    .resume-info { flex: 1; min-width: 0; }
    .resume-title {
      font-size: 13px; font-weight: 500; color: var(--txt);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .resume-meta {
      font-family: var(--mono); font-size: 9px; color: var(--txt3);
      letter-spacing: 0.06em; margin-top: 2px;
    }
    .resume-arrow { color: var(--acc); font-size: 18px; flex-shrink: 0; }

    /* ── EMPTY STATE ── */
    .empty-state {
      padding: 56px 24px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .empty-icon {
      font-size: 48px; opacity: 0.5;
      filter: grayscale(0.5);
    }
    .empty-title {
      font-family: var(--head); font-size: 18px; font-weight: 600;
      color: var(--txt2); letter-spacing: 0.02em;
    }
    .empty-hint {
      font-family: var(--mono); font-size: 11px;
      color: var(--txt3); letter-spacing: 0.06em;
      line-height: 1.7; max-width: 280px;
    }
    .empty-cta {
      margin-top: 8px; font-family: var(--head); font-size: 14px;
      font-weight: 600; padding: 10px 20px;
      background: var(--acc); color: #000; border: none; border-radius: 8px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.04em;
    }



    /* ── DASHBOARD HOME ── */
    .home-greet {
      padding: 22px 4px 22px;
      border-bottom: 1px solid var(--s3);
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
    }
    /* Subtle ambient glow behind greeting */
    .home-greet::before {
      content: "";
      position: absolute;
      top: -40px; left: -20px;
      width: 260px; height: 160px;
      background: radial-gradient(ellipse, #38bdf815 0%, transparent 70%);
      pointer-events: none;
    }
    .greet-eyebrow {
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.22em; color: var(--acc);
      text-transform: uppercase; margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .greet-eyebrow::before {
      content: "";
      width: 20px; height: 1px;
      background: var(--acc); display: block;
    }
    .greet-title {
      font-family: var(--head); font-size: clamp(36px, 9vw, 52px);
      font-weight: 700; line-height: 1.0;
      letter-spacing: -0.01em; color: var(--txt);
    }
    .greet-title .accent {
      color: var(--acc);
      text-shadow: 0 0 40px #38bdf840;
    }
    .greet-sub {
      font-family: var(--sans); font-size: 14px;
      color: var(--txt3); margin-top: 10px;
      font-weight: 400; line-height: 1.5;
      letter-spacing: 0.01em;
    }

    /* PRIMARY ACTION CARD */
    .home-cta {
      display: flex; align-items: center; gap: 16px;
      padding: 20px 20px;
      background: var(--acc);
      border-radius: 14px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s, opacity 0.12s;
      box-shadow: 0 8px 32px #38bdf835, 0 0 0 1px #38bdf820;
      margin-bottom: 10px;
      position: relative; overflow: hidden;
    }
    .home-cta::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
      pointer-events: none;
    }
    .home-cta:active { transform: scale(0.97); opacity: 0.9; }
    .home-cta-icon {
      width: 54px; height: 54px;
      background: rgba(0,0,0,0.15);
      border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; flex-shrink: 0;
    }
    .home-cta-text { flex: 1; min-width: 0; color: #000; }
    .home-cta-title {
      font-family: var(--head); font-size: 22px;
      font-weight: 700; letter-spacing: 0.02em; line-height: 1;
    }
    .home-cta-sub {
      font-family: var(--mono); font-size: 10px;
      font-weight: 500; opacity: 0.6; margin-top: 5px;
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    .home-cta-arrow {
      font-size: 28px; color: rgba(0,0,0,0.5); flex-shrink: 0;
    }

    /* SECONDARY MODE BUTTONS */
    .home-secondary {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; margin-bottom: 16px;
    }
    .secondary-btn {
      padding: 15px 14px; border: 1px solid var(--s4);
      background: var(--s1); border-radius: 12px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; gap: 12px;
      transition: all 0.15s;
    }
    .secondary-btn:active { background: var(--s2); transform: scale(0.97); }
    .secondary-btn-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .secondary-btn.flip-mode { border-color: #1a4060; }
    .secondary-btn.buy-mode  { border-color: #0d3020; }
    .secondary-btn.flip-mode .secondary-btn-icon { background: var(--acc-bg); }
    .secondary-btn.buy-mode  .secondary-btn-icon { background: var(--go-bg); }
    .secondary-btn-text { flex: 1; min-width: 0; }
    .secondary-btn-label {
      font-family: var(--head); font-size: 16px;
      font-weight: 600; color: var(--txt); line-height: 1;
    }
    .secondary-btn-sub {
      font-family: var(--mono); font-size: 9px;
      color: var(--txt3); margin-top: 4px;
      letter-spacing: 0.08em; text-transform: uppercase;
    }

    /* STATS GRID */
    .stats-section { margin-bottom: 16px; }
    .section-label {
      font-family: var(--mono); font-size: 9px;
      letter-spacing: 0.18em; color: var(--txt3);
      text-transform: uppercase; padding: 0 4px;
      margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .section-link {
      font-family: var(--mono); font-size: 9px;
      color: var(--acc); cursor: pointer;
      letter-spacing: 0.1em;
      -webkit-tap-highlight-color: transparent;
    }
    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-card {
      background: var(--s1); border: 1px solid var(--s3);
      border-radius: 12px; padding: 16px 16px 18px;
      position: relative; overflow: hidden;
      transition: transform 0.12s;
    }
    .stat-card:active { transform: scale(0.98); }
    .stat-card.hero {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #0d1a0d 0%, var(--s1) 100%);
      border-color: var(--go-b);
    }
    .stat-label {
      font-family: var(--mono); font-size: 9px;
      letter-spacing: 0.16em; color: var(--txt3);
      text-transform: uppercase; margin-bottom: 10px;
    }
    .stat-value {
      font-family: var(--head); font-size: 34px;
      font-weight: 700; line-height: 1;
      letter-spacing: -0.02em; color: var(--txt);
    }
    .stat-value.pos { color: var(--go); }
    .stat-value.neg { color: var(--ng); }
    .stat-value.acc { color: var(--acc); }
    .stat-value.warn { color: var(--mb); }
    .stat-value-prefix { font-size: 16px; opacity: 0.5; margin-right: 1px; }
    .stat-sub {
      font-family: var(--mono); font-size: 9px;
      color: var(--txt3); margin-top: 5px;
      letter-spacing: 0.05em;
    }
    .stat-sub.delta-pos { color: var(--go); }
    .stat-sub.delta-neg { color: var(--ng); }

    /* HIT RATE BAR */
    .hit-rate-bar {
      height: 4px; background: var(--s3);
      border-radius: 2px; margin-top: 10px;
      overflow: hidden; position: relative;
    }
    .hit-rate-fill {
      height: 100%; background: var(--go);
      border-radius: 2px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .hit-rate-segments {
      position: absolute; inset: 0; display: flex;
      justify-content: space-between;
    }

    /* RECENT SCANS STRIP */
    .recent-scroll {
      display: flex; gap: 10px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding: 4px 0 8px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .recent-scroll::-webkit-scrollbar { display: none; }
    .recent-card {
      flex-shrink: 0; width: 148px;
      background: var(--s1); border: 1px solid var(--s4);
      border-radius: 12px; overflow: hidden;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      scroll-snap-align: start;
      transition: transform 0.15s;
    }
    .recent-card:active { transform: scale(0.96); }
    .recent-card.go-card    { border-top: 2px solid var(--go); }
    .recent-card.maybe-card { border-top: 2px solid var(--mb); }
    .recent-card.nogo-card  { border-top: 2px solid var(--ng); }
    .recent-card-img {
      width: 100%; height: 104px; object-fit: cover;
      background: var(--s3);
    }
    .recent-card-img-empty {
      width: 100%; height: 100px; background: var(--s3);
      display: flex; align-items: center; justify-content: center;
      color: var(--txt3); font-size: 24px;
    }
    .recent-card-body { padding: 8px 10px 10px; }
    .recent-card-name {
      font-size: 12px; font-weight: 500; color: var(--txt);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .recent-card-meta {
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--mono); font-size: 9px;
      letter-spacing: 0.04em;
    }
    .recent-card-verdict {
      font-family: var(--head); font-size: 12px;
      font-weight: 700; letter-spacing: 0.04em;
    }
    .recent-card-verdict.go    { color: var(--go); }
    .recent-card-verdict.maybe { color: var(--mb); }
    .recent-card-verdict.nogo  { color: var(--ng); }
    .recent-card-score { color: var(--txt3); }

    .recent-empty {
      flex-shrink: 0; width: 100%;
      padding: 24px 16px; background: var(--s1);
      border: 1px dashed var(--s3); border-radius: 10px;
      text-align: center;
    }
    .recent-empty-icon { font-size: 32px; opacity: 0.4; margin-bottom: 8px; }
    .recent-empty-text {
      font-family: var(--mono); font-size: 11px;
      color: var(--txt3); letter-spacing: 0.06em;
      line-height: 1.6;
    }

    /* DAILY TIP / INSIGHT */
    .insight-card {
      background: linear-gradient(135deg, var(--s1) 0%, var(--s2) 100%);
      border: 1px solid var(--s3); border-radius: 12px;
      padding: 16px; display: flex; gap: 12px;
      align-items: flex-start;
    }
    .insight-icon {
      width: 36px; height: 36px;
      background: var(--acc-bg); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .insight-text { flex: 1; }
    .insight-title {
      font-family: var(--head); font-size: 14px;
      font-weight: 600; color: var(--txt); margin-bottom: 4px;
      letter-spacing: 0.01em;
    }
    .insight-body {
      font-size: 13px; color: var(--txt2);
      line-height: 1.55; font-weight: 300;
    }


    /* ── MULTI-IMAGE UPLOAD ── */
    .img-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 12px;
    }
    .img-thumb-wrap {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      background: var(--s3);
    }
    .img-thumb {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .img-thumb-remove {
      position: absolute; top: 4px; right: 4px;
      width: 22px; height: 22px;
      background: rgba(0,0,0,0.75);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      color: #fff; font-size: 11px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .img-thumb-num {
      position: absolute; bottom: 4px; left: 5px;
      font-family: var(--mono); font-size: 9px;
      color: rgba(255,255,255,0.7); letter-spacing: 0.04em;
    }
    .img-add-btn {
      aspect-ratio: 1;
      border-radius: 8px;
      border: 1.5px dashed var(--s5);
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      font-size: 22px; color: var(--txt3);
      transition: all 0.15s; position: relative;
    }
    .img-add-btn:active { background: var(--acc-bg); border-color: var(--acc); }
    .img-add-btn input {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .img-add-label {
      font-family: var(--mono); font-size: 9px;
      color: var(--txt3); letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .img-grid-footer {
      padding: 0 12px 12px;
      font-family: var(--mono); font-size: 9px;
      color: var(--txt3); letter-spacing: 0.06em;
      display: flex; align-items: center; justify-content: space-between;
    }
    .img-count-pill {
      background: var(--s3); border: 1px solid var(--s4);
      border-radius: 10px; padding: 3px 10px;
      font-family: var(--mono); font-size: 9px;
      color: var(--txt2); letter-spacing: 0.06em;
    }


    /* ── ONBOARDING OVERLAY ── */
    .onboard-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.92);
      display: flex; align-items: flex-end;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
    .onboard-sheet {
      width: 100%; background: var(--s1);
      border-top: 1px solid var(--s3);
      border-radius: 20px 20px 0 0;
      padding: 28px 24px calc(28px + env(safe-area-inset-bottom));
      animation: slideUp 0.4s cubic-bezier(0.34, 1.1, 0.64, 1);
    }
    @keyframes slideUp { from{transform:translateY(100%);} to{transform:translateY(0);} }
    .onboard-step-indicator {
      display: flex; gap: 6px; justify-content: center; margin-bottom: 28px;
    }
    .onboard-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--s4); transition: all 0.3s;
    }
    .onboard-dot.active { background: var(--acc); width: 20px; border-radius: 3px; }
    .onboard-icon { font-size: 52px; text-align: center; margin-bottom: 16px; }
    .onboard-title {
      font-family: var(--head); font-size: 28px; font-weight: 700;
      color: var(--txt); text-align: center; margin-bottom: 10px;
      letter-spacing: 0.01em; line-height: 1.1;
    }
    .onboard-body {
      font-size: 15px; color: var(--txt2); text-align: center;
      line-height: 1.65; font-weight: 300; margin-bottom: 28px;
    }
    .onboard-next {
      width: 100%; min-height: 54px;
      background: var(--acc); color: #000;
      font-family: var(--head); font-weight: 700;
      font-size: 20px; letter-spacing: 0.04em;
      text-transform: uppercase; border: none;
      border-radius: 12px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }
    .onboard-next:active { opacity: 0.85; }
    .onboard-skip {
      display: block; text-align: center;
      font-family: var(--mono); font-size: 10px;
      color: var(--txt3); letter-spacing: 0.1em;
      margin-top: 14px; cursor: pointer;
      text-transform: uppercase;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── SCORE EXPLAINER MODAL ── */
    .score-tap-hint {
      font-family: var(--mono); font-size: 8px;
      color: var(--txt3); letter-spacing: 0.1em;
      text-transform: uppercase; margin-top: 3px;
      opacity: 0.6;
    }
    .score-col { cursor: pointer; -webkit-tap-highlight-color: transparent; }

    /* ── FEEDBACK BUTTONS ── */
    .feedback-row {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px; background: var(--s2);
      border-top: 1px solid var(--s3);
    }
    .feedback-label {
      font-family: var(--mono); font-size: 10px;
      color: var(--txt3); letter-spacing: 0.08em;
      text-transform: uppercase; flex: 1;
    }
    .feedback-btn {
      min-height: 36px; padding: 0 14px;
      background: var(--s3); border: 1px solid var(--s4);
      border-radius: 6px; cursor: pointer;
      font-size: 16px; -webkit-tap-highlight-color: transparent;
      transition: all 0.15s;
    }
    .feedback-btn:active { transform: scale(0.92); }
    .feedback-btn.selected-up   { background: var(--go-bg); border-color: var(--go-b); }
    .feedback-btn.selected-down { background: var(--ng-bg); border-color: var(--ng-b); }

    /* ── DISCLAIMER ── */
    .disclaimer {
      padding: 12px 16px; text-align: center;
      font-family: var(--mono); font-size: 9px;
      color: var(--txt3); letter-spacing: 0.04em;
      line-height: 1.7; border-top: 1px solid var(--s3);
    }

    /* ── HOW IT WORKS (Settings) ── */
    .how-card {
      background: var(--s1); border: 1px solid var(--s3);
      border-radius: var(--r); overflow: hidden; margin-bottom: 8px;
    }
    .how-card-row {
      display: flex; gap: 14px; align-items: flex-start;
      padding: 14px 16px; border-bottom: 1px solid var(--s3);
    }
    .how-card-row:last-child { border-bottom: none; }
    .how-step-num {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--acc-bg); border: 1px solid #1a4060;
      font-family: var(--mono); font-size: 12px; color: var(--acc);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-weight: 500;
    }
    .how-step-text { flex: 1; }
    .how-step-title {
      font-size: 13px; font-weight: 600; color: var(--txt);
      margin-bottom: 3px;
    }
    .how-step-desc {
      font-size: 12px; color: var(--txt2);
      line-height: 1.55; font-weight: 300;
    }
    .limitation-row {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 10px 16px; border-bottom: 1px solid var(--s3);
      font-size: 12px; color: var(--txt2); line-height: 1.5;
      font-weight: 300;
    }
    .limitation-row:last-child { border-bottom: none; }
    .limitation-icon { flex-shrink: 0; font-size: 13px; margin-top: 1px; }


    /* ── SCAM RISK BANNER ── */
    .scam-banner {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border-radius: var(--r);
      margin-bottom: 10px; border: 1px solid;
      animation: rise 0.3s ease;
    }
    .scam-banner.high   { background: #2a0a0a; border-color: #7f1d1d; }
    .scam-banner.medium { background: var(--mb-bg); border-color: var(--mb-b); }
    .scam-banner.low    { background: var(--s2); border-color: var(--s4); }
    .scam-icon { font-size: 22px; flex-shrink: 0; }
    .scam-text { flex: 1; }
    .scam-title {
      font-family: var(--head); font-size: 15px; font-weight: 700;
      letter-spacing: 0.02em; margin-bottom: 3px;
    }
    .scam-banner.high   .scam-title { color: #fca5a5; }
    .scam-banner.medium .scam-title { color: var(--mb); }
    .scam-banner.low    .scam-title { color: var(--txt2); }
    .scam-reason { font-size: 12px; color: var(--txt2); line-height: 1.5; font-weight: 300; }

    /* ── DECISION CALLOUT ── */
    .decision-bar {
      padding: 12px 16px;
      background: var(--s2); border-top: 1px solid var(--s3);
      font-size: 14px; font-weight: 500; color: var(--txt);
      line-height: 1.5; font-style: italic;
      border-left: 3px solid;
    }
    .v-go    .decision-bar { border-left-color: var(--go); }
    .v-maybe .decision-bar { border-left-color: var(--mb); }
    .v-nogo  .decision-bar { border-left-color: var(--ng); }

    /* ── VERDICT CARD GLOW ── */
    .verdict-card.v-go   { box-shadow: 0 0 0 1px var(--go-b), 0 4px 24px #22c55e18; }
    .verdict-card.v-nogo { box-shadow: 0 0 0 1px var(--ng-b), 0 4px 24px #ef444418; }

    /* BOTTOM NAV */
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--s3);display:flex;align-items:center;justify-content:space-around;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));z-index:100;}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;cursor:pointer;border-radius:8px;-webkit-tap-highlight-color:transparent;transition:background .15s;}
    .nav-item:active{background:var(--s3);}
    .nav-icon{font-size:20px;}
    .nav-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--txt3);text-transform:uppercase;}
    .nav-item.active .nav-lbl{color:var(--acc);}
  </style>

</head>

        const dataUrl = canvas.toDataURL("image/jpeg", 0.88);

        resolve({ dataUrl, b64: dataUrl.split(",")[1] });

    function AnimatedNumber({ value, duration = 1100, prefix = "", suffix = "" }) {
      const [display, setDisplay] = useState(0);
      useEffect(() => {
        if (value == null) { setDisplay(0); return; }
        const target = Number(value);
        if (isNaN(target)) { setDisplay(0); return; }
        const start = performance.now();
        let raf;
        const tick = (now) => {
          const elapsed = now - start;
          const t = Math.min(elapsed / duration, 1);
          // ease-out cubic
          const eased = 1 - Math.pow(1 - t, 3);
          setDisplay(target * eased);
          if (t < 1) raf = requestAnimationFrame(tick);
          else setDisplay(target);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [value]);
      const rounded = Math.round(display);
      return <span>{prefix}{rounded.toLocaleString()}{suffix}</span>;
    }

            const savings = fairMid - total;
            if (savings > 0) totalSaved += savings;
          }
        });

        return {
          totalScans: history.length,
          flipCount: flips.length,
          buyCount: buys.length,
          hitRate,
          goCount,
          recent7d: recent.length,
          totalProfitLow:  Math.round(totalProfitLow),
          totalProfitHigh: Math.round(totalProfitHigh),
          totalSaved: Math.round(totalSaved),

      const insights = [
        { icon: "💡", title: "Pro tip", body: "Always check title status. A bike with a clean title resells for 30-40% more than salvage." },

        { icon: "📅", title: "Best timing", body: "Sunday evenings = sellers tired of weekend tire-kickers. Best negotiation window." },
        { icon: "🚫", title: "Walk away", body: "If the seller won't share VIN/serial number upfront, walk. No exceptions." },

      const ONBOARD_STEPS = [
        {
          icon: "🔍",
          title: "Welcome to KevTify",
          body: "Your AI-powered marketplace deal scanner. Screenshot any listing, get an instant GO / NO-GO verdict with deal math and negotiation lines."
        },
        {
          icon: "📸",
          title: "Add Screenshots",
          body: "Upload up to 5 screenshots of the same listing — price, description, item photos. The more you give Claude, the sharper the analysis."

        {
          icon: "📈",
          title: "Two Modes",
          body: "Flip Mode scores deals by profit margin — repair cost vs resale value. Buy Mode tells you if the asking price is fair for a personal purchase."
        },
        {
          icon: "⚠️",
          title: "One Thing to Know",
          body: "KevTify uses AI estimates based on general market knowledge. Always verify repairs and prices in person. This is a starting point, not a final word."

      ];

      const dismissOnboard = () => {

        try { localStorage.setItem("kevtify_onboarded", "1"); } catch(e) {}

      const saveFeedback = (histId, val) => {
        const updated = {...feedback, [histId]: val};

      return (

                  <button className="modal-cancel" onClick={()=>setNoteModal(null)}>Cancel</button>

            </div>

          {showOnboard && (
            <div className="onboard-overlay" onClick={dismissOnboard}>
              <div className="onboard-sheet" onClick={e=>e.stopPropagation()}>
                <div className="onboard-step-indicator">

                <span className="onboard-skip" onClick={dismissOnboard}>Skip</span>
              </div>
            </div>

          {/* ── SCORE EXPLAINER MODAL ── */}

            <div className="modal-overlay" onClick={()=>setShowScore(false)}>

                    {range:"80–100",label:"GO",color:"var(--go)",cls:"go-card",desc:"Strong deal. Solid margin or fair price with minimal risk."},
                    {range:"50–79",label:"MAYBE",color:"var(--mb)",cls:"maybe-card",desc:"Potential deal but proceed cautiously. Negotiate hard or walk if seller won't move."},
                    {range:"0–49",label:"NO-GO",color:"var(--ng)",cls:"nogo-card",desc:"Not worth it at asking price. Too much risk, too little margin, or too many red flags."},

                      <div style={{flex:1}}>

                        <div style={{fontSize:12,color:"var(--txt2)",lineHeight:1.5,fontWeight:300}}>{s.desc}</div>

                    <div className="secondary-btn-sub">For profit</div>
                  </div>

                <div className="secondary-btn buy-mode" onClick={()=>{setMode("buy"); setTab("scan"); reset();}}>
                  <div className="secondary-btn-icon">🛒</div>
                  <div className="secondary-btn-text">
                    <div className="secondary-btn-label">Buy Mode</div>
                    <div className="secondary-btn-sub">For yourself</div>
                  </div>
                </div>
              </div>

              {/* STATS */}
              {stats ? (
                <>

                      <span className="section-link" onClick={()=>setTab("history")}>VIEW ALL →</span>

                            <div className="stat-value pos">
                              <span className="stat-value-prefix">$</span><AnimatedNumber value={stats.totalSaved} duration={900} />
                            </div>
                            <div className="stat-sub">Vs. fair market on Buy Mode wins</div>

                      </div>

                      <div className="stat-card">
                        <div className="stat-label">Total Scans</div>
                        <div className="stat-value acc"><AnimatedNumber value={stats.totalScans} duration={700} /></div>
                        <div className="stat-sub">{stats.recent7d} in past 7 days</div>
                      </div>

                      <div className="stat-card">
                        <div className="stat-label">GO Hit Rate</div>
                        <div className={"stat-value " + (stats.hitRate >= 30 ? "warn" : "pos")}><AnimatedNumber value={stats.hitRate} duration={700} />%</div>
                        <div className="hit-rate-bar"><div className="hit-rate-fill" style={{width: stats.hitRate + "%"}} /></div>
                      </div>
                    </div>
                  </div>

                  {/* RECENT SCANS */}
                  <div className="stats-section">
                    <div className="section-label">
                      <span>Recent Scans</span>
                      <span className="section-link" onClick={()=>setTab("history")}>SEE ALL →</span>
                    </div>
                    <div className="recent-scroll">
                      {stats.recentScans.map(entry => (
                        <div key={entry.id} className={"recent-card " + (entry.verdict==="GO"?"go-card":entry.verdict==="MAYBE"?"maybe-card":"nogo-card")} onClick={()=>loadFromHistory(entry)}>

                            ? <img src={entry.thumb} alt="" className="recent-card-img" />

                          <div className="recent-card-body">
                            <div className="recent-card-name">{entry.item}</div>
                            <div className="recent-card-meta">
                              <span className={"recent-card-verdict " + (entry.verdict==="GO"?"go":entry.verdict==="MAYBE"?"maybe":"nogo")}>{entry.verdict}</span>
                              <span className="recent-card-score">{entry.score}/100</span>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </>
              ) : (
                <div className="stats-section">
                  <div className="section-label"><span>Get Started</span></div>
                  <div className="recent-empty">
                    <div className="recent-empty-icon">📊</div>
                    <div className="recent-empty-text">
                      Run your first scan to start tracking<br />your deal-finding stats.
                    </div>
                  </div>
                </div>
              )}

              {/* DAILY INSIGHT */}
              <div className="stats-section">
                <div className="section-label"><span>Today's Insight</span></div>
                <div className="insight-card">
                  <div className="insight-icon">{todayInsight.icon}</div>
                  <div className="insight-text">
                    <div className="insight-title">{todayInsight.title}</div>
                    <div className="insight-body">{todayInsight.body}</div>
                  </div>
                </div>
              </div>

            </div>
          )}

          {/* ── SCAN TAB ── */}
          {tab==="scan" && (
            <div className="main">

              {/* ADD TO HOME SCREEN BANNER */}
              {showInstall && (
                <div className="install-banner">
                  <div className="install-text">
                    <strong>Install KevTify</strong> — tap the Share button in Safari, then <strong>"Add to Home Screen"</strong> for a native app experience.
                  </div>
                  <div className="install-dismiss" onClick={dismissInstall}>✕</div>
                </div>
              )}

              <div className="mode-toggle">
                <button className={"mode-btn"+(mode==="flip"?" active-flip":"")} onClick={()=>{
                  if (data && images.length) { analyze("flip"); }
                  else { setMode("flip"); reset(); }
                }}>📈 Flip Mode</button>
                <button className={"mode-btn"+(mode==="buy"?" active-buy":"")} onClick={()=>{
                  if (data && images.length) { analyze("buy"); }
                  else { setMode("buy"); reset(); }
                }}>🛒 Buy Mode</button>
              </div>

              {!apiKey && (
                <div className="nokey-banner">
                  <div className="nokey-text">⚠ No API key — tap Set Key, paste your key from console.anthropic.com, hit Save.</div>
                  <button className="nokey-btn" onClick={()=>setTab("settings")}>Set Key →</button>
                </div>
              )}

              {!data && (
                <div className="card">
                  <div className="card-hdr">
                    <div className="hdr-left"><div className="hdr-dot" />Listing Screenshot</div>
                    <div className="hdr-right">{converting ? "PROCESSING..." : images.length > 0 ? images.length + " LOADED" : "STEP 1 OF 2"}</div>
                  </div>
                  {images.length === 0 ? (
                    /* Empty state — no images yet */
                    <div className="upload-tap" onClick={()=>!converting&&fileRef.current.click()}>
                      <input ref={fileRef} type="file" accept="image/*" multiple onChange={e=>load(e.target.files)} />
                      {converting ? (
                        <>
                          <div className="up-icon">⏳</div>
                          <div className="up-label">Processing...</div>
                          <div className="up-sub">Converting & compressing</div>
                        </>
                      ) : (
                        <>
                          <div className="up-icon">📸</div>
                          <div className="up-label">Tap to add screenshots</div>
                          <div className="up-sub">Add up to 5 — price, description, photos</div>
                          <div className="fmt-row">
                            {["JPG","PNG","WEBP","HEIC"].map(f=><span key={f} className="fmt-chip">{f}</span>)}
                          </div>
                        </>
                      )}
                    </div>
                  ) : (
                    /* Images loaded — show grid with add more */
                    <>
                      <div className="img-grid">
                        {images.map((im, i) => (
                          <div key={i} className="img-thumb-wrap">
                            <img src={im.dataUrl} className="img-thumb" alt="" />
                            <div className="img-thumb-num">{i+1}</div>
                            <div className="img-thumb-remove" onClick={()=>setImages(prev=>prev.filter((_,idx)=>idx!==i))}>✕</div>
                          </div>
                        ))}
                        {images.length < 5 && (
                          <div className="img-add-btn">
                            <input type="file" accept="image/*" multiple onChange={e=>load(e.target.files)} />
                            <span>+</span>
                            <span className="img-add-label">Add more</span>
                          </div>
                        )}
                      </div>
                      <div className="img-grid-footer">
                        <span>{images.length} of 5 screenshots · tap ✕ to remove</span>
                        <span className="img-count-pill">{converting ? "Processing..." : "READY"}</span>
                      </div>
                    </>
                  )}
                </div>
              )}

              {images.length > 0 && !data && (
                <div className="context-wrap">
                  <textarea
                    className="context-input"
                    rows={2}
                    placeholder="Optional context — e.g. seller said $800 firm, needs tires"
                    value={ctx}
                    maxLength={CTX_MAX}
                    onChange={e=>setCtx(e.target.value)}
                    onFocus={e=>setTimeout(()=>e.target.scrollIntoView({behavior:"smooth",block:"nearest"}),300)}
                  />
                  <div className={"context-count"+(ctx.length>CTX_MAX*0.85?" warn":"")}>{ctx.length}/{CTX_MAX}</div>
                </div>
              )}

              {images.length > 0 && !data && (
                <button
                  className={"analyze-btn "+(mode==="flip"?"flip-btn":"buy-btn")}
                  onClick={analyze}
                  disabled={busy||converting||images.length===0}
                  ref={analyzeRef}
                >
                  {busy ? "Analyzing..." : (mode==="flip" ? "Analyze Flip →" : "Analyze Buy →")}
                </button>
              )}

              {busy && (() => {
                const phases = [
                  { lbl: "Preparing request", cur: 0 },
                  { lbl: "Claude analyzing image", cur: 1 },
                  { lbl: "Parsing results", cur: 2 }
                ];
                const currentLbl = phases[Math.min(phase, phases.length - 1)]?.lbl || "Processing";
                return (
                  <div className="loading-card">
                    <div className="loading-track"><div className="loading-fill" /></div>
                    <div className="loading-lbl">{currentLbl}</div>
                    {ctx && <div className="loading-ctx">Context: {ctx}</div>}
                    <div className="phase-list">
                      {phases.map((p, i) => {
                        const status = phase > i ? "done" : phase === i ? "active" : "pending";
                        return (
                          <div key={i} className={"phase-item " + status}>
                            <div className="phase-icon">{status === "pending" ? (i+1) : ""}</div>
                            <div>{p.lbl}</div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })()}

              {err && (
                <div className="err-card">
                  <div className="err-msg">⚠ {err}</div>
                  <button className="retry-btn" onClick={analyze}>Retry</button>
                </div>
              )}

              {data && (
                <div className="results">

                  {images.length > 0 && data && (
                    <div className="result-thumb">
                      <img src={images[0].dataUrl} alt="listing" />
                      <div className="result-thumb-info">
                        <div className="result-thumb-item">{data.item||"Analyzed Listing"}</div>
                        <div className="result-thumb-mode">{mode==="flip"?"📈 Flip Mode":"🛒 Buy Mode"}</div>
                      </div>
                      <div className="rescan-btn" onClick={()=>setData(null)}>Re-scan</div>
                    </div>
                  )}

                  <div className={"verdict-card "+v}>
                    <div className="verdict-top">
                      <div className="score-col" onClick={()=>setShowScore(true)}>

                          const p = calcPercentile(data.score, history, mode);

                          const pillCls = p.pct >= 70 ? "top" : p.pct >= 40 ? "mid" : "low";
                          return (
                            <div className="score-percentile">
                              <span className={"percentile-pill " + pillCls}>TOP {100-p.pct}%</span>
                            </div>
                          );
                        })()}
                      </div>

                        <div className="badge-word">{data.verdict}</div>
                        <div className="badge-sub">
                          {mode==="flip"
                            ? (data.verdict==="GO" ? "Buy It" : data.verdict==="MAYBE" ? "Negotiate First" : "Walk Away")
                            : (data.verdict==="GO" ? "Worth It" : data.verdict==="MAYBE" ? "Push The Price" : "Skip This One")}
                        </div>
                      </div>
                      <div className="offer-col">
                        <div className="offer-lbl">Open At</div>
                        <div className="offer-val">{data.opening_offer != null ? <AnimatedDollar value={data.opening_offer} duration={1100} /> : "—"}</div>
                        <div className="offer-ask">Ask: {fmt(data.asking_price)}</div>
                      </div>
                    </div>
                    <div className="summary-row">
                      <div className="summary-txt">{data.summary}</div>
                    </div>
                    {data.decision && (
                      <div className="decision-bar">"{data.decision}"</div>

                              <div className="math-cell"><div className="math-lbl">Repair Est.</div><div className="math-val warn">{fmt(f.estimated_repair_cost_low)}</div><div className="math-range">– {fmt(f.estimated_repair_cost_high)}</div></div>
                              <div className="math-cell"><div className="math-lbl">Resale Est.</div><div className="math-val">{fmt(f.estimated_resale_low)}</div><div className="math-range">– {fmt(f.estimated_resale_high)}</div></div>
                              <div className="math-cell"><div className="math-lbl">Flip Profit</div><div className={"math-val "+pc(f.estimated_profit_low,f.estimated_profit_high)}>{fmt(f.estimated_profit_low)}</div><div className="math-range">– {fmt(f.estimated_profit_high)}</div></div>
