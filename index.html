                            <>
                              <div className="math-cell"><div className="math-lbl">Fair Market</div><div className="math-val">{fmt(f.fair_market_low)}</div><div className="math-range">– {fmt(f.fair_market_high)}</div></div>
                              <div className="math-cell"><div className="math-lbl">Asking Price</div><div className="math-val">{fmt(data.asking_price)}</div><div className="math-range">listed</div></div>
                              <div className="math-cell">
                                <div className="math-lbl">vs Market</div>
                                <div className={"math-val "+(f.overprice_underprice<0?"pos":f.overprice_underprice>0?"neg":"warn")}>
                                  {f.overprice_underprice!=null?(f.overprice_underprice>0?"+":"")+("$"+Math.abs(Number(f.overprice_underprice)).toLocaleString()):"—"}
                                </div>
                                <div className="math-range">{f.overprice_underprice<0?"under market":f.overprice_underprice>0?"over market":"at market"}</div>
                              </div>
                              <div className="math-cell"><div className="math-lbl">All-In Est.</div><div className="math-val warn">{fmt(f.total_cost_low)}</div><div className="math-range">w/ repairs</div></div>
                            </>
                          )}
                          {f.notes && <div className="math-note">Note: {f.notes}</div>}
                        </div>
                      </div>
                    )}
                  </div>

                  {data.flags?.length>0 && (
                    <div className="card" style={{marginBottom:0}}>
                      <div className="card-hdr">
                        <div className="hdr-left"><div className="hdr-dot" />Signal Analysis</div>
                        <div className="hdr-right">{data.flags.length} FLAGS</div>
                      </div>
                      {data.flags.map((fl,i)=>(
                        <div key={i} className={"flag-row "+fl.severity}>
                          <div className="flag-sev"><div className="sev-dot" />{fl.severity}</div>
                          <div className="flag-txt">{fl.text}</div>
                        </div>
                      ))}
                    </div>
                  )}

                  {data.negotiation_lines?.length>0 && (
                    <div className="card" style={{marginBottom:0}}>
                      <div className="card-hdr">
                        <div className="hdr-left"><div className="hdr-dot" />Negotiation Script</div>
                        <div className="hdr-right">READY TO SEND</div>
                      </div>
                      {data.negotiation_lines.map((line,i)=>(
                        <div key={i} className={"neg-row" + (copiedLine === i ? " copied" : "")} onClick={()=>{
                          navigator.clipboard.writeText(line);
                          setCopiedLine(i);
                          if (navigator.vibrate) navigator.vibrate(20);
                          setTimeout(()=>setCopiedLine(-1), 1500);
                        }}>
                          <div className="neg-n">{String(i+1).padStart(2,"0")}</div>
                          <div className="neg-t">{line}</div>
                          <div className="copy-hint">{copiedLine === i ? "✓ COPIED" : "TAP TO COPY"}</div>
                        </div>
                      ))}
                      <div className="copy-row">
                        <button className={"copy-btn"+(copied?" done":"")} onClick={copy}>{copied?"✓ Copied":"Copy Lines"}</button>
                        <button className="share-btn" onClick={share}>Share Analysis</button>
                      </div>
                    </div>
                  )}

                  {/* FEEDBACK */}
                  {history.length > 0 && (() => {
                    const lastEntry = history[0];
                    const fb = feedback[lastEntry?.id];
                    return (
                      <div className="feedback-row">
                        <div className="feedback-label">Was this accurate?</div>
                        <button
                          className={"feedback-btn" + (fb==="up" ? " selected-up" : "")}
                          onClick={()=>saveFeedback(lastEntry.id, fb==="up" ? null : "up")}
                        >👍</button>
                        <button
                          className={"feedback-btn" + (fb==="down" ? " selected-down" : "")}
                          onClick={()=>saveFeedback(lastEntry.id, fb==="down" ? null : "down")}
                        >👎</button>
                      </div>
                    );
                  })()}

                  {/* DISCLAIMER */}
                  <div className="disclaimer">
                    AI estimates only — not financial advice. Always verify condition,<br />title status, and pricing before buying or selling.
                  </div>

                  <button className="reset-btn" onClick={reset}>↩ Scan New Listing</button>
                </div>
              )}
            </div>
          )}

          {/* ── HISTORY TAB ── */}
          {tab==="history" && (
            <div className="main">
              <div className="card" style={{marginBottom:0}}>
                <div className="card-hdr">
                  <div className="hdr-left"><div className="hdr-dot" />Scan History</div>
                  <div className="hdr-right">{filteredHistory.length} of {history.length}</div>
                </div>

                {history.length === 0 ? (
                  <div className="empty-state">
                    <div className="empty-icon">📋</div>
                    <div className="empty-title">No Scans Yet</div>
                    <div className="empty-hint">Analyze any marketplace listing and it'll save here automatically. Tap any past scan to revisit it.</div>
                    <button className="empty-cta" onClick={()=>setTab("scan")}>Run Your First Scan</button>
                  </div>
                ) : (
                  <>
                    <div className="hist-controls">
                      <input
                        className="hist-search"
                        placeholder="Search items..."
                        value={histSearch}
                        onChange={e=>setHistSearch(e.target.value)}
                      />
                      {[
                        {id:"all", lbl:"All"},
                        {id:"go", lbl:"GO"},
                        {id:"maybe", lbl:"MAYBE"},
                        {id:"nogo", lbl:"NO-GO"},
                        {id:"flip", lbl:"Flip"},
                        {id:"buy", lbl:"Buy"},
                      ].map(filt => (
                        <div
                          key={filt.id}
                          className={"hist-filter-pill" + (histFilter === filt.id ? " active" : "")}
                          onClick={()=>setHistFilter(filt.id)}
                        >{filt.lbl}</div>
                      ))}
                    </div>

                    {filteredHistory.length === 0 ? (
                      <div className="empty-state">
                        <div className="empty-icon" style={{fontSize:36}}>🔍</div>
                        <div className="empty-title" style={{fontSize:15}}>No Matches</div>
                        <div className="empty-hint">Try a different search term or filter</div>
                      </div>
                    ) : filteredHistory.map(entry => (
                      <div key={entry.id} className="hist-item-wrap">
                        <div className="hist-delete-bg" onClick={()=>deleteHistoryItem(entry.id)}>Delete</div>
                        <div
                          className={"hist-item-swipe" + (swipedId === entry.id ? " swiped" : "")}
                          onTouchStart={e => onSwipeStart(entry.id, e)}
                          onTouchEnd={e => onSwipeEnd(entry.id, e)}
                          onClick={() => {
                            if (swipedId === entry.id) { setSwipedId(null); return; }
                            loadFromHistory(entry);
                          }}
                        >
                          <div className="hist-item">
                            {entry.thumb ? <img className="hist-thumb" src={entry.thumb} alt="" /> : <div className="hist-thumb" />}
                            <div className="hist-info">
                              <div className="hist-item-name">{entry.item}</div>
                              <div className="hist-meta">{entry.ts} · {entry.mode==="flip"?"📈 Flip":"🛒 Buy"} · Ask: {fmt(entry.asking_price)}</div>
                              {entry.note ? <div className="hist-note">📝 {entry.note}</div> : null}
                            </div>
                            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
                              <div className={"hist-badge "+(entry.verdict==="GO"?"go":entry.verdict==="MAYBE"?"maybe":"nogo")}>{entry.verdict}</div>
                              <div className="hist-score">{entry.score}/100</div>
                              <div style={{fontFamily:"var(--mono)",fontSize:"9px",color:"var(--txt3)",cursor:"pointer",marginTop:2,padding:"2px 6px",background:"var(--s3)",borderRadius:4}} onClick={e=>{e.stopPropagation();openNote(entry);}}>NOTE</div>
                            </div>
                          </div>
                        </div>
                      </div>
                    ))}
                    <div className="hist-warn">⚠ Swipe left on any item to delete · History is stored on this device only</div>
                    <button className="hist-clear" onClick={clearHistory}>Clear All History</button>
                  </>
                )}
              </div>
            </div>
          )}

          {/* ── SETTINGS TAB ── */}
          {tab==="settings" && (
            <div className="main">
              <div className="settings-section">
                <div className="settings-label">API Key Status</div>
                <div className="settings-row">
                  <div><div className="settings-row-label">Anthropic API Key</div><div className="settings-row-sub">Required to run analysis</div></div>
                  <div className={"key-status "+(apiKey?"set":"unset")}>{apiKey?"SET":"NOT SET"}</div>
                </div>
              </div>
              <div className="settings-section">
                <div className="settings-label">Enter API Key</div>
                <input className="api-input" type="password" placeholder="sk-ant-..." value={keyDraft} onChange={e=>setKeyDraft(e.target.value)} autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false" />
                <button className={"save-btn"+(keySaved?" saved":"")} onClick={saveKey}>{keySaved?"✓ Saved":"Save Key"}</button>
                <div className="settings-hint">Get your key at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a><br />Stored on this device only. Sent directly to Anthropic — nowhere else.</div>
              </div>
              <div className="settings-section">
                <div className="settings-label">Install App</div>
                <div className="settings-row">
                  <div>
                    <div className="settings-row-label">Add to Home Screen</div>
                    <div className="settings-row-sub">Safari → Share → Add to Home Screen</div>
                  </div>
                  <div style={{fontSize:20}}>📲</div>
                </div>
              </div>
              <div className="settings-section">
                <div className="settings-label">How KevTify Works</div>
                <div className="how-card">
                  {[
                    {n:"1", title:"Screenshot a listing", desc:"Grab 1–5 screenshots from any marketplace — Facebook, Craigslist, OfferUp, eBay, anything. Price, description, and photos all help."},
                    {n:"2", title:"Claude reads the listing", desc:"Claude Sonnet AI analyzes every detail in your screenshots — price, condition, description, red flags, and missing info."},
                    {n:"3", title:"Market knowledge fills the gaps", desc:"Claude draws on broad market knowledge to estimate fair value, repair costs, and resale range for hundreds of categories."},
                    {n:"4", title:"You get a scored verdict", desc:"GO / MAYBE / NO-GO with a 0–100 score, deal math, flag analysis, and a ready-to-send negotiation script tailored to the listing."},
                  ].map(s => (
                    <div key={s.n} className="how-card-row">
                      <div className="how-step-num">{s.n}</div>
                      <div className="how-step-text">
                        <div className="how-step-title">{s.title}</div>
                        <div className="how-step-desc">{s.desc}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="settings-section">
                <div className="settings-label">Limitations to Know</div>
                <div className="how-card">
                  {[
                    {icon:"⚠️", text:"Price estimates are based on general market knowledge, not live data. Actual prices vary by region, condition, and timing."},
                    {icon:"🔧", text:"Repair cost estimates assume standard labor rates. Your cost may differ if you do your own work (usually much lower)."},
                    {icon:"📸", text:"Blurry, cropped, or partial screenshots give worse results. More clear screenshots = better analysis."},
                    {icon:"🤖", text:"Claude can miss context not visible in the screenshot — verbal agreements, in-person condition, seller history."},
                    {icon:"⚖️", text:"Not financial or legal advice. Always inspect in person and verify title before any purchase."},
                  ].map((l,i) => (
                    <div key={i} className="limitation-row">
                      <span className="limitation-icon">{l.icon}</span>
                      <span>{l.text}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="settings-section">
                <div className="settings-label">Changelog</div>
                <div className="how-card">
                  {[
                    {v:"v1.2", note:"Onboarding, score explainer, feedback, limitations, multi-image upload fix"},
                    {v:"v1.1", note:"Dashboard home, history search/filter, swipe to delete, tap-to-copy lines, haptics"},
                    {v:"v1.0", note:"Initial release — Flip/Buy modes, price gauge, waterfall chart, history, settings"},
                  ].map((c,i) => (
                    <div key={i} className="how-card-row" style={{gap:16}}>
                      <div style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--acc)",letterSpacing:"0.08em",minWidth:36}}>{c.v}</div>
                      <div style={{fontSize:12,color:"var(--txt2)",lineHeight:1.5,fontWeight:300,flex:1}}>{c.note}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="settings-section">
                <div className="settings-label">About</div>
                <div className="settings-row">
                  <div><div className="settings-row-label">KevTify</div><div className="settings-row-sub">Marketplace deal analyzer</div></div>
                  <div style={{fontFamily:"var(--mono)",fontSize:"10px",color:"var(--txt3)"}}>v1.1</div>
                </div>
                <div className="settings-row">
                  <div><div className="settings-row-label">Scan History</div><div className="settings-row-sub">{history.length} scans stored locally</div></div>
                  <div style={{fontFamily:"var(--mono)",fontSize:"11px",color:"var(--ng)",cursor:"pointer"}} onClick={clearHistory}>CLEAR</div>
                </div>
              </div>
            </div>
          )}

          {/* BOTTOM NAV */}
          <div className="bottom-nav">
            <div className={"nav-item"+(tab==="home"?" active":"")} onClick={()=>setTab("home")}><div className="nav-icon">🏠</div><div className="nav-lbl">Home</div></div>
            <div className={"nav-item"+(tab==="scan"?" active":"")} onClick={()=>setTab("scan")}><div className="nav-icon">🔍</div><div className="nav-lbl">Scan</div></div>
            <div className={"nav-item"+(tab==="history"?" active":"")} onClick={()=>setTab("history")}><div className="nav-icon">📋</div><div className="nav-lbl">History</div></div>
            <div className={"nav-item"+(tab==="settings"?" active":"")} onClick={()=>setTab("settings")}><div className="nav-icon">⚙️</div><div className="nav-lbl">Settings</div></div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

</body>
</html>
